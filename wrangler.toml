name = "al-jawahira-workstation"
main = "src/worker.js"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "./public"
binding = "ASSETS"

[[d1_databases]]
binding = "DB"
database_name = "al-jawahira-db"
database_id = "al-jawahira-db-prod"
migrations_dir = "migrations"

[observability]
enabled = true
